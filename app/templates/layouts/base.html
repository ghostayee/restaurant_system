<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}RestroPro - Restaurant System{% endblock %}</title>

    <!-- Bootstrap 5 + Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <style>
      :root {
        --primary-orange: #ff6b00;
        --dark-green: #0f4c3a;
        --light-green: #22c55e;
      }
      body {
        background-color: #0f172a;
        color: #e2e8f0;
        font-family: "Segoe UI", sans-serif;
      }
      .navbar {
        background-color: var(--dark-green) !important;
      }
      .btn-primary {
        background-color: var(--primary-orange);
        border: none;
      }
      .btn-primary:hover {
        background-color: #e55a00;
      }
      .card {
        background-color: #1e2937;
        border: none;
      }
      .text-accent {
        color: var(--primary-orange);
      }
    </style>
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark shadow sticky-top">
      <div class="container">
        <a class="navbar-brand fw-bold fs-3" href="{{ url_for('main.index') }}">
          🍽️ <span class="text-accent">Restro</span>Pro
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            {% if current_user.is_authenticated %}
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('main.dashboard') }}"
                >Dashboard</a
              >
            </li>
            <li class="nav-item dropdown">
              <a
                class="nav-link dropdown-toggle"
                href="#"
                role="button"
                data-bs-toggle="dropdown"
              >
                {{ current_user.full_name }}
              </a>
              <ul class="dropdown-menu">
                <li>
                  <a class="dropdown-item" href="{{ url_for('auth.logout') }}"
                    >Logout</a
                  >
                </li>
              </ul>
            </li>
            {% else %}
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('auth.login') }}">Login</a>
            </li>
            {% endif %}
          </ul>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-4">{% block content %}{% endblock %}</div>

    <!-- Footer -->
    <footer class="bg-dark py-4 mt-5">
      <div class="container text-center">
        <p class="mb-0">&copy; 2026 RestroPro - Restaurant Management System</p>
        <small class="text-muted">Built with ❤️ for modern restaurants</small>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
